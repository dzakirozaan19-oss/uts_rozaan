<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
.container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    max-width: 500px;
    width: 100%;
  }
  h1 {
    color: #fff;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }
.subtitle {
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 14px;
    margin-bottom: 25px;
  }
.input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
  }
  #taskInput {
    flex: 1;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    outline: none;
  }
  #taskInput::placeholder { color: rgba(255, 255, 255, 0.5); }
  #taskInput:focus {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
  }
.add-btn {
    padding: 14px 20px;
    background: linear-gradient(135deg, #00f5a0, #00d9f5);
    border: none;
    border-radius: 12px;
    color: #000;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
  }
.add-btn:active { transform: scale(0.95); }

.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
  }
.filter-btn {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
  }
.filter-btn.active {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.4);
  }

  #taskList { list-style: none; }
.task-item {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideIn 0.3s;
    transition: 0.3s;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
.task-item:hover { background: rgba(255, 255, 255, 0.15); }
.checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
  }
.checkbox.checked {
    background: linear-gradient(135deg, #00f5a0, #00d9f5);
    border-color: #00f5a0;
  }
.checkbox i { color: #000; font-size: 12px; display: none; }
.checkbox.checked i { display: block; }

.task-text {
    flex: 1;
    color: #fff;
    font-size: 15px;
  }
.task-text.done {
    text-decoration: line-through;
    color: rgba(255, 255, 255, 0.5);
  }
.delete-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
  }
.delete-btn:hover { color: #ff4757; }

.empty {
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    padding: 40px 20px;
    font-size: 14px;
  }
.stats {
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📝 My Tasks</h1>
    <p class="subtitle">Stay organized, stay productive</p>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tulis tugas baru..." maxlength="100">
      <button class="add-btn" onclick="addTask()">
        <i class="fas fa-plus"></i>
      </button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="filterTasks('all')">Semua</button>
      <button class="filter-btn" onclick="filterTasks('active')">Aktif</button>
      <button class="filter-btn" onclick="filterTasks('done')">Selesai</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats" id="stats">0 tugas</div>
  </div>

<script>
let tasks = JSON.parse(localStorage.getItem('tasksPro') || '[]');
let currentFilter = 'all';

function saveTasks() {
  localStorage.setItem('tasksPro', JSON.stringify(tasks));
  renderTasks();
}

function addTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;
  
  tasks.unshift({
    id: Date.now(),
    text: text,
    done: false,
    created: new Date().toISOString()
  });
  
  input.value = '';
  saveTasks();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done =!task.done;
    saveTasks();
  }
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
}

function filterTasks(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  let filtered = tasks;
  
  if (currentFilter === 'active') filtered = tasks.filter(t =>!t.done);
  if (currentFilter === 'done') filtered = tasks.filter(t => t.done);
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">Belum ada tugas ✨<br>Tambah tugas pertama kamu!</div>';
  } else {
    list.innerHTML = filtered.map(task => `
      <li class="task-item">
        <div class="checkbox ${task.done ? 'checked' : ''}" onclick="toggleTask(${task.id})">
          <i class="fas fa-check"></i>
        </div>
        <span class="task-text ${task.done ? 'done' : ''}">${task.text}</span>
        <button class="delete-btn" onclick="deleteTask(${task.id})">
          <i class="fas fa-trash"></i>
        </button>
      </li>
    `).join('');
  }
  
  const done = tasks.filter(t => t.done).length;
  document.getElementById('stats').textContent = 
    `${tasks.length} tugas • ${done} selesai • ${tasks.length - done} aktif`;
}

document.getElementById('taskInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addTask();
});

renderTasks();
</script>
</body>
</html>
