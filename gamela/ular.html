<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }
   .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid #334155;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 28px;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text; 
    -webkit-text-fill-color: transparent;    }
   .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 600;
    }
    #gameCanvas {
      width: 100%;
      border-radius: 12px;
      border: 3px solid #334155;
      background: #0f172a;
      display: block;
    }
   .btn-row {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
   .btn {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
   .btn:active { transform: scale(0.96); background: #475569; }
   .btn-primary { background: #22c55e; }
   .btn-primary:active { background: #16a34a; }

   .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 200px;
      margin: 0 auto;
    }
   .dpad button {
      padding: 20px;
      font-size: 20px;
      background: #334155;
      color: #f1f5f9;
      border: none;
      border-radius: 10px;
    }
   .dpad button:active { background: #475569; }
   .up { grid-column: 2; }
   .left { grid-column: 1; grid-row: 2; }
   .down { grid-column: 2; grid-row: 2; }
   .right { grid-column: 3; grid-row: 2; }

    #gameOver {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
   .modal {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SNAKE PRO 🐍</h1>
    <div class="stats">
      <div>Skor: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="btn-row">
      <button class="btn btn-primary" id="startBtn">START</button>
      <button class="btn" id="pauseBtn">PAUSE</button>
    </div>

    <div class="dpad">
      <button class="up" onclick="setDirection(0,-1)">↑</button>
      <button class="left" onclick="setDirection(-1,0)">←</button>
      <button class="down" onclick="setDirection(0,1)">↓</button>
      <button class="right" onclick="setDirection(1,0)">→</button>
    </div>
  </div>

  <div id="gameOver">
    <div class="modal">
      <h2 style="margin-bottom: 15px;">GAME OVER</h2>
      <p style="font-size: 20px; margin-bottom: 20px;">Skor: <span id="finalScore">0</span></p>
      <button class="btn btn-primary" onclick="startGame()">MAIN LAGI</button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const finalScoreEl = document.getElementById('finalScore');
const gameOverScreen = document.getElementById('gameOver');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');

const size = 20;
const tileCount = canvas.width / size;
let snake, food, vx, vy, score, bestScore, loop, playing, paused;

bestScore = parseInt(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = bestScore;

function startGame() {
  snake = [{x: 10, y: 10}];
  vx = 1; vy = 0;
  score = 0;
  playing = true;
  paused = false;
  scoreEl.textContent = 0;
  gameOverScreen.style.display = 'none';
  startBtn.textContent = 'RESTART';
  pauseBtn.textContent = 'PAUSE';
  spawnFood();
  clearInterval(loop);
  loop = setInterval(update, 130);
  draw();
}

function togglePause() {
  if (!playing) return;
  paused =!paused;
  pauseBtn.textContent = paused? 'LANJUT' : 'PAUSE';
}

function spawnFood() {
  food = {
    x: Math.floor(Math.random() * tileCount),
    y: Math.floor(Math.random() * tileCount)
  };
  for (let s of snake) {
    if (s.x === food.x && s.y === food.y) {
      spawnFood();
      return;
    }
  }
}

function setDirection(x, y) {
  if (!playing || paused) return;
  if (x === -vx && y === -vy) return; // ga boleh mundur
  vx = x; vy = y;
}

function update() {
  if (!playing || paused) return;

  let head = {x: snake[0].x + vx, y: snake[0].y + vy};

  // Tembus tembok
  if (head.x < 0) head.x = tileCount - 1;
  if (head.x >= tileCount) head.x = 0;
  if (head.y < 0) head.y = tileCount - 1;
  if (head.y >= tileCount) head.y = 0;

  // Nabrak badan
  for (let s of snake) {
    if (head.x === s.x && head.y === s.y) {
      gameOver();
      return;
    }
  }

  snake.unshift(head);

  // Makan
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 400, 400);

  // Grid tipis
  ctx.strokeStyle = '#1e293b';
  for (let i = 0; i < tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * size, 0);
    ctx.lineTo(i * size, 400);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * size);
    ctx.lineTo(400, i * size);
    ctx.stroke();
  }

  // Makanan
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x * size + size/2, food.y * size + size/2, size/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Ular
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0? '#22c55e' : '#4ade80';
    ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);

    // Mata di kepala
    if (i === 0) {
      ctx.fillStyle = '#0f172a';
      let eyeX = s.x * size + size/2 + vx * 3;
      let eyeY = s.y * size + size/2 + vy * 3;
      ctx.fillRect(eyeX - 2, eyeY - 2, 4, 4);
    }
  });
}

function gameOver() {
  playing = false;
  clearInterval(loop);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('snakeBest', bestScore);
    bestEl.textContent = bestScore;
  }
  finalScoreEl.textContent = score;
  gameOverScreen.style.display = 'flex';
}

startBtn.onclick = startGame;
pauseBtn.onclick = togglePause;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') setDirection(0, -1);
  if (e.key === 'ArrowDown') setDirection(0, 1);
  if (e.key === 'ArrowLeft') setDirection(-1, 0);
  if (e.key === 'ArrowRight') setDirection(1, 0);
  if (e.key === ' ') togglePause();
  if (e.key === 'Enter' &&!playing) startGame();
});

draw();
</script>
</body>
</html>
