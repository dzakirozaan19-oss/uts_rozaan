<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator - Rozaan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #212529; }
    .btn-calc { height: 65px; font-size: 1.3rem; }
    #layar { font-size: 2.2rem; text-align: right; height: 70px; }
    .card { border: 1px solid #ffc107; }
  </style>
</head>
<body class="text-white">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card bg-dark">
          <div class="card-body">
            <h4 class="text-center mb-3 text-warning">Kalkulator</h4>
            <input type="text" id="layar" class="form-control mb-3 bg-secondary text-white" readonly>
            
            <div class="row g-2">
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="clearAll()">AC</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="del()">DEL</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="input('%')">%</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="input('/')">÷</button></div>
              
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('7')">7</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('8')">8</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('9')">9</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="input('*')">×</button></div>
              
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('4')">4</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('5')">5</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('6')">6</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="input('-')">-</button></div>
              
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('1')">1</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('2')">2</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('3')">3</button></div>
              <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="input('+')">+</button></div>
              
              <div class="col-6"><button class="btn btn-secondary w-100 btn-calc" onclick="input('0')">0</button></div>
              <div class="col-3"><button class="btn btn-secondary w-100 btn-calc" onclick="input('.')">.</button></div>
              <div class="col-3"><button class="btn btn-success w-100 btn-calc" onclick="hitung()">=</button></div>
            </div>
          </div>
        <p class="text-center mt-3 text-muted">by Rozaan.FineShyt</p>
      </div>
    </div>
  </div>

  <script>
    let layar = document.getElementById('layar');
    
    function input(val) {
      layar.value += val;
    }
    
    function clearAll() {
      layar.value = '';
    }
    
    function del() {
      layar.value = layar.value.slice(0, -1);
    }
    
    function hitung() {
      try {
        if (layar.value.includes('/0')) {
          alert('Error: Tidak bisa dibagi dengan 0');
          return;
        }
        
        let soal = layar.value; // SIMPAN SOALNYA
        let hasil = eval(soal);
        hasil = Number.isInteger(hasil) ? hasil : parseFloat(hasil.toFixed(2));
        
        // INI DIA KUNCINYA: LANGSUNG TIMPAH LAYAR JADI "SOAL = HASIL"
        layar.value = soal + ' = ' + hasil;
        
      } catch (error) {
        alert('Perhitungan tidak valid');
        layar.value = '';
      }
    }
  </script>
</body>
</html>
